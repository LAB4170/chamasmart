[build]
  base = "frontend/"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://chamasmart-khrb.onrender.com/api/v1"
  VITE_FIREBASE_API_KEY = "AIzaSyAKZb39OLyjc3JsJW_7J7Xk3J3sa6BUXqA"
  VITE_FIREBASE_AUTH_DOMAIN = "chamasmart-1c600.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "chamasmart-1c600"
  VITE_FIREBASE_STORAGE_BUCKET = "chamasmart-1c600.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "475835064239"
  VITE_FIREBASE_APP_ID = "1:475835064239:web:f75f507997a83be468195a"
  VITE_FIREBASE_MEASUREMENT_ID = "G-B6SCZ78MF3"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: https:;
      connect-src 'self' https://chamasmart-khrb.onrender.com wss://chamasmart-khrb.onrender.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://firebasestorage.googleapis.com;
      frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
    """
