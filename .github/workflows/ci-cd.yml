name: ChamaSmart CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        working-directory: backend
        run: mvn -B test

  migrations:
    name: Fresh database matches entities
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build jar
        working-directory: backend
        run: mvn -B -q -DskipTests package
      - name: Boot on an empty database with schema validation
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/ci
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci
          SPRING_JPA_DDL_AUTO: validate
          SERVER_PORT: '8089'
        run: |
          export JWT_SECRET=$(head -c 48 /dev/urandom | base64)
          export DATA_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64)
          java -jar target/chamasmart-backend-1.0.0-SNAPSHOT.jar > boot.log 2>&1 &
          for i in $(seq 1 40); do
            if grep -q "Started ChamaSmartApplication" boot.log; then echo "booted"; exit 0; fi
            if grep -q "Application run failed" boot.log; then tail -60 boot.log; exit 1; fi
            sleep 3
          done
          tail -60 boot.log; exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Build the backend image (not pushed)
        run: docker build -t chamasmart-backend:ci .
