server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: chamasmart-backend
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    # Optimized for Neon Serverless PostgreSQL & Local Fallback
    url: jdbc:${SPRING_DATASOURCE_URL:postgresql://localhost:5432/chamasmart?sslmode=prefer}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 15
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000 # 30 minutes max lifetime to prevent Neon serverless connection drops
      keepalive-time: 30000 # Keepalive heartbeats for Neon proxy

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update} # Auto-create/update schema on startup
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

        flyway:
          enabled: false


app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,https://chamasmart.netlify.app}
  mpesa:
    env: ${MPESA_ENV:sandbox}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:YOUR_DARAJA_SANDBOX_CONSUMER_SECRET}
    callback-secret: ${MPESA_CALLBACK_SECRET:}
    shortcode: ${MPESA_SHORTCODE:174379}
    # Official Safaricom Sandbox Passkey (public for sandbox use)
    passkey: ${MPESA_PASSKEY:bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
    callback-url: ${MPESA_CALLBACK_URL:https://chamasmart-khrb.onrender.com/api/v1/mpesa/callback}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:chamasmart-1c600}
    client-email: ${FIREBASE_CLIENT_EMAIL:firebase-adminsdk-fbsvc@chamasmart-1c600.iam.gserviceaccount.com}
    private-key: ${FIREBASE_PRIVATE_KEY:}
  ai:
    gemini-key: ${GEMINI_API_KEY:}
    groq-key: ${GROQ_API_KEY:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
